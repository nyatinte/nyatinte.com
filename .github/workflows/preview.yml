name: PR Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

# PR を閉じたときの削除は、後続の push でキャンセルされないよう別のグループにする。
concurrency:
  group: ${{ github.event.action == 'closed' && format('preview-cleanup-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      CF_SEND_TELEMETRY: "false"
      VP_GIT_HOOKS: "0"
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID の Secrets が必要です。" >&2
            exit 1
          fi

      - name: Build Worker
        if: github.event.action != 'closed'
        env:
          PREVIEW_EDIT: "1"
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm build

      - name: Create Worker Preview
        if: github.event.action != 'closed'
        id: create-preview
        shell: bash
        run: |
          set -euo pipefail
          # 本番デプロイと同じく varlock-wrangler を使う。素の wrangler だと
          # __VARLOCK_ENV バインディングが無く、Cloudflare が 10021 で拒否する。
          # 出力は WRANGLER_OUTPUT_FILE_PATH の JSONL から読む（stdout には
          # varlock の状態行が混ざる）。
          output="$RUNNER_TEMP/preview.jsonl"
          rm -f "$output"
          WRANGLER_OUTPUT_FILE_PATH="$output" \
            pnpm exec varlock-wrangler preview --name "$PREVIEW_NAME"
          # 代入で受けないと、抽出が失敗しても echo の終了コードで成功扱いになる。
          preview_url="$(node scripts/parse-preview-url.mjs "$output")"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Comment on pull request
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.create-preview.outputs.preview_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # heredoc の中ではバッククォートがコマンド置換になるため使わない。
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$(cat <<EOF
          ## プレビュー

          | 対象 | URL |
          | --- | --- |
          | PR #$PR_NUMBER の Preview | <$PREVIEW_URL> |

          > [!NOTE]
          > Cloudflare Access のログインが必要です。

          <details>
          <summary>運用</summary>

          - 本番とは隔離された Cloudflare Worker Preview です
          - PR を閉じると自動で削除されます
          - push のたびにこのコメントは上書きされます
          - 上限は Worker あたり 100 Preview で、超えるとデプロイが古い Preview から消えます

          </details>
          EOF
          )"

      - name: Delete Worker Preview
        if: github.event.action == 'closed'
        run: pnpm exec varlock-wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation
