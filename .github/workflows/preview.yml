name: PR Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

concurrency:
  group: ${{ github.event.action == 'closed' && format('preview-cleanup-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      CF_SEND_TELEMETRY: "false"
      VP_GIT_HOOKS: "0"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Worker
        run: pnpm build

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID の Secrets が必要です。" >&2
            exit 1
          fi

      - name: Create Worker Preview
        id: create-preview
        shell: bash
        run: |
          set -euo pipefail
          # 本番デプロイと同じく varlock-wrangler を使う。素の wrangler だと
          # __VARLOCK_ENV バインディングが無く、Cloudflare が 10021 で拒否する。
          # varlock-wrangler は stdout に状態行を出すことがあるので、JSON を抜き出す。
          preview_json="$(pnpm exec varlock-wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json)"
          preview_url="$(
            printf '%s\n' "$preview_json" | python3 -c '
          import json, sys
          text = sys.stdin.read()
          dec = json.JSONDecoder()
          idx = 0
          while True:
              i = text.find("{", idx)
              if i < 0:
                  break
              try:
                  obj, end = dec.raw_decode(text, i)
              except json.JSONDecodeError:
                  idx = i + 1
                  continue
              idx = end
              urls = (obj.get("preview") or {}).get("urls") or []
              if urls:
                  print(urls[0])
                  sys.exit(0)
          sys.stderr.write("preview URL を出力から取り出せませんでした:\n" + text)
          sys.exit(1)
          '
          )"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Comment on pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.create-preview.outputs.preview_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$(cat <<EOF
          ## プレビュー

          この PR の Cloudflare Worker Preview（本番とは隔離されています）:

          $PREVIEW_URL

          PR を閉じると自動で削除されます。
          EOF
          )"

      - name: Probe Preview
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.create-preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          status="$(curl --fail --show-error --silent -o /dev/null -w "%{http_code}" "$PREVIEW_URL/")"
          if [ "$status" != "200" ]; then
            echo "Preview probe failed with HTTP $status"
            exit 1
          fi

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID の Secrets が必要です。" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete Worker Preview
        run: pnpm exec varlock-wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
