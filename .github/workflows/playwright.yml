name: Playwright Visual Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm exec playwright test --update-snapshots

      - name: Commit snapshots if changed
        id: snapshot-commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/
          if ! git diff --staged --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "chore(e2e): update playwright snapshots [skip ci]"
            git push
          fi

      - name: Fail if snapshots were updated
        if: steps.snapshot-commit.outputs.changed == 'true'
        run: |
          echo "::error::スナップショットが更新されました。差分を確認して問題なければ再実行してください。"
          exit 1

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
