name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      production_deploy:
        description: 本番Deployを実行するときだけ deploy を選択
        required: true
        default: skip
        type: choice
        options:
          - skip
          - deploy

concurrency:
  group: nyatinte-com-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: pnpm check

      - name: Build Worker
        run: pnpm build

      - name: Test built Worker over HTTP
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/worker.log"
          pnpm dev:worker >"$log_file" 2>&1 &
          worker_pid=$!

          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/ >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat "$log_file"
            exit 1
          fi

          VITE_HELLO_WORLD_URL=http://127.0.0.1:8787 pnpm test
          pnpm test:d1

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_deploy == 'deploy'
    environment: production
    needs: verify
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy Worker
        run: pnpm run deploy

      - name: Smoke test deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if VITE_HELLO_WORLD_URL=https://nyatinte.com pnpm test; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          exit 1
