name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      production_deploy:
        description: 本番Deployを実行するときだけ deploy を選択
        required: true
        default: skip
        type: choice
        options:
          - skip
          - deploy

concurrency:
  group: nyatinte-com-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      CF_SEND_TELEMETRY: "false"
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect application changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: paths
        with:
          filters: |
            app:
              - '**'
              - '!README.md'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!docs/**'
              - '!.agents/**'

      - name: Decide verification scope
        id: decide
        env:
          PATHS_APP: ${{ steps.paths.outputs.app }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          elif [ "$PATHS_APP" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip heavy verification (docs and vendored skills only)
        if: steps.decide.outputs.full != 'true'
        run: |
          echo "No changes outside root agent docs (README.md, AGENTS.md, CLAUDE.md, docs/**) or .agents/**; skipping install, check, build, and HTTP tests."
          echo "The Verify check still completes successfully so required status checks are satisfied."

      - name: Set up pnpm
        if: steps.decide.outputs.full == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        if: steps.decide.outputs.full == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.decide.outputs.full == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check source
        if: steps.decide.outputs.full == 'true'
        run: pnpm check

      - name: Build Worker
        if: steps.decide.outputs.full == 'true'
        run: pnpm build

      - name: Test built Worker over HTTP
        if: steps.decide.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/worker.log"
          pnpm dev:worker >"$log_file" 2>&1 &
          worker_pid=$!

          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/ >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat "$log_file"
            exit 1
          fi

          VITE_HELLO_WORLD_URL=http://127.0.0.1:8787 pnpm test

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_deploy == 'deploy'
    environment: production
    needs: verify
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUDIENCE: ${{ vars.ACCESS_AUDIENCE }}
      ACHIEVEMENT_GITHUB_TOKEN: ${{ secrets.ACHIEVEMENT_GITHUB_TOKEN }}
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy Worker
        run: pnpm run deploy

      - name: Smoke test deployed Worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if VITE_HELLO_WORLD_URL=https://nyatinte.com pnpm test; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          exit 1
