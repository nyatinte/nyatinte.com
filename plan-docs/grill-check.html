<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>やった。 / 設計チェック</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --panel: #121212;
        --line: #2a2a2a;
        --text: #e8e8e8;
        --muted: #8a8a8a;
        --accent: #d4ff4f;
        --accent-dim: #3a4415;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Hiragino Kaku Gothic ProN',
          'Noto Sans JP', sans-serif;
        line-height: 1.6;
      }
      code,
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(10, 10, 10, 0.9);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        letter-spacing: 0.02em;
        font-weight: 600;
      }
      header .count {
        font-size: 13px;
        color: var(--muted);
        margin-left: auto;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 24px 20px 120px;
      }
      .summary {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        padding: 16px 18px;
        margin-bottom: 28px;
      }
      .summary h2 {
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 10px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .summary ul {
        margin: 0;
        padding-left: 18px;
        font-size: 14px;
      }
      .summary li {
        margin: 2px 0;
      }
      section.group {
        margin-bottom: 32px;
      }
      section.group > h2 {
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 500;
        margin: 0 0 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      section.group > h2::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .item {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 10px;
        background: var(--panel);
      }
      .item.answered {
        border-color: var(--accent-dim);
      }
      .item > .label {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .item > .note {
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .opts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .opt {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 13px 6px 11px;
        font-size: 13.5px;
        cursor: pointer;
        user-select: none;
        transition:
          border-color 0.12s,
          background 0.12s;
      }
      .opt:hover {
        border-color: #444;
      }
      .opt input {
        accent-color: var(--accent);
        margin: 0;
      }
      .opt:has(input:checked) {
        border-color: var(--accent);
        background: #1a1f0a;
      }
      .rec {
        font-size: 10.5px;
        color: var(--bg);
        background: var(--accent);
        border-radius: 4px;
        padding: 1px 5px;
        margin-left: 2px;
        font-weight: 700;
      }
      input[type='text'] {
        width: 100%;
        background: #0d0d0d;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        padding: 9px 12px;
        font-size: 14px;
        font-family: inherit;
      }
      input[type='text']:focus {
        outline: none;
        border-color: var(--accent);
      }
      .prompt-wrap {
        border-top: 1px solid var(--line);
        padding-top: 24px;
      }
      .prompt-wrap h2 {
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 500;
        margin: 0 0 12px;
      }
      textarea {
        width: 100%;
        min-height: 220px;
        background: #0d0d0d;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        padding: 14px;
        font-size: 13px;
        line-height: 1.7;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      button {
        font-family: inherit;
        font-size: 13.5px;
        border-radius: 8px;
        padding: 9px 16px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: #1a1a1a;
        color: var(--text);
        transition:
          background 0.12s,
          border-color 0.12s;
      }
      button:hover {
        background: #242424;
      }
      button.primary {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        font-weight: 700;
      }
      button.primary:hover {
        filter: brightness(1.08);
      }
      button.ghost {
        background: transparent;
        color: var(--muted);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%) translateY(20px);
        background: var(--accent);
        color: var(--bg);
        font-size: 13px;
        font-weight: 700;
        padding: 9px 18px;
        border-radius: 999px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.18s,
          transform 0.18s;
        z-index: 100;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="mono">やった。 / 設計チェック v0.1</h1>
      <span class="count" id="count"></span>
    </header>

    <main>
      <div class="summary">
        <h2>決定済み</h2>
        <ul>
          <li>永続化: <span class="mono">D1 + Drizzle</span></li>
          <li>投稿・管理: MVP は MCP 一本（Web 管理画面は後回し）</li>
          <li>
            スタック: SvelteKit 3 (RC) + Svelte 5 / valibot / Tailwind +
            @shadcn/lint / Vite+ / Cloudflare Workers / varlock
          </li>
          <li>サイト構成: home（プロフィール） / 実績ページ</li>
        </ul>
      </div>

      <div id="app"></div>

      <div class="prompt-wrap">
        <h2>生成されたプロンプト</h2>
        <textarea id="prompt" readonly></textarea>
        <div class="actions">
          <button class="primary" id="copyAll">まとめてコピー</button>
          <button id="copyMissing">未回答だけコピー</button>
          <button class="ghost" id="clear">回答をすべて消す</button>
        </div>
      </div>
    </main>

    <div class="toast" id="toast">コピーしました</div>

    <script>
      const GROUPS = [
        {
          id: 'tech',
          title: '技術構成',
          items: [
            {
              id: 'mcp_place',
              label: 'MCP サーバーの置き場所',
              type: 'radio',
              options: [
                { v: 'same_worker', label: 'SvelteKit Worker に同居', rec: true },
                { v: 'separate_worker', label: '別 Worker に分離' },
                { v: 'monorepo', label: 'monorepo (apps/mcp)' },
              ],
            },
            {
              id: 'mcp_auth',
              label: 'MCP の認証',
              note: 'スマホのアプリから使うなら OAuth が必要になる可能性が高い',
              type: 'radio',
              options: [
                { v: 'bearer', label: '静的 Bearer トークンのみ', rec: true },
                { v: 'oauth', label: 'MVP から OAuth も入れる' },
                { v: 'access', label: 'Cloudflare Access を併用' },
              ],
            },
            {
              id: 'mobile_post',
              label: 'スマホからの投稿',
              type: 'radio',
              options: [
                { v: 'later', label: 'MVP 外（後回し）', rec: true },
                { v: 'mvp', label: 'MVP に含める（OAuth 必須）' },
              ],
            },
            {
              id: 'sveltekit_ver',
              label: 'SvelteKit のバージョン',
              note: 'SvelteKit 3 は 2026-08 時点で RC',
              type: 'radio',
              options: [
                { v: 'v3rc', label: 'SvelteKit 3 RC で行く', rec: true },
                { v: 'v2', label: '2.x stable で行く' },
              ],
            },
            {
              id: 'test',
              label: 'テスト範囲',
              type: 'radio',
              options: [
                { v: 'vitest', label: 'Vitest のみ（ロジック中心）', rec: true },
                { v: 'vitest_pw', label: 'Vitest + Playwright' },
              ],
            },
            {
              id: 'ci',
              label: 'CI/CD',
              type: 'radio',
              options: [
                { v: 'gha', label: 'GitHub Actions + wrangler', rec: true },
                { v: 'cloudflare', label: 'Cloudflare の Git 連携' },
                { v: 'manual', label: '手動デプロイ' },
              ],
            },
            {
              id: 'repo_layout',
              label: 'リポジトリ構成',
              type: 'radio',
              options: [
                { v: 'single', label: '単一アプリ', rec: true },
                { v: 'monorepo', label: 'monorepo（packages 分離）' },
              ],
            },
          ],
        },
        {
          id: 'data',
          title: 'データ / API',
          items: [
            {
              id: 'idempotency',
              label: 'プッシュの冪等性',
              note: '「各リクエストに冪等性」の実装方法が未定義',
              type: 'radio',
              options: [
                { v: 'clamp', label: '上限5に丸めるだけで足りる', rec: true },
                { v: 'reqid', label: 'クライアント生成のリクエストID' },
              ],
            },
            {
              id: 'public_metric',
              label: '公開する指標',
              type: 'radio',
              options: [
                { v: 'total', label: '合計プッシュ数のみ（現状維持）', rec: true },
                { v: 'both', label: '合計 + ユニーク人数' },
              ],
            },
            {
              id: 'total_storage',
              label: '合計プッシュ数の持ち方',
              type: 'radio',
              options: [
                { v: 'sum', label: '都度 SUM で集計', rec: true },
                { v: 'denorm', label: 'achievements に denormalize' },
              ],
            },
            {
              id: 'rate_limit',
              label: 'レート制限の実装',
              type: 'radio',
              options: [
                { v: 'binding', label: 'Cloudflare Rate Limiting binding', rec: true },
                { v: 'do', label: 'Durable Object' },
                { v: 'own', label: 'KV / D1 で自前' },
              ],
            },
            {
              id: 'markdown',
              label: 'Markdown の変換タイミング',
              type: 'radio',
              options: [
                { v: 'read', label: '読み取り時に変換 + サニタイズ', rec: true },
                { v: 'write', label: '書き込み時に HTML を保存' },
              ],
            },
            {
              id: 'draft',
              label: '下書き状態',
              type: 'radio',
              options: [
                { v: 'none', label: 'MVP では持たない（即公開のみ）', rec: true },
                { v: 'have', label: '非公開フラグを持つ' },
              ],
            },
            {
              id: 'deleted_url',
              label: '削除済み実績の URL',
              type: 'radio',
              options: [
                { v: '410', label: '410 Gone', rec: true },
                { v: '404', label: '404' },
                { v: 'restore', label: '復元導線を表示' },
              ],
            },
            {
              id: 'slug',
              label: 'slug の作り方',
              note: '日本語タイトルからどう作るか',
              type: 'radio',
              options: [
                { v: 'auto', label: '英数字を自動生成（連番/ランダム）', rec: true },
                { v: 'manual', label: '手動指定' },
                { v: 'romaji', label: '日本語をローマ字変換' },
              ],
            },
            {
              id: 'image',
              label: '画像の扱い',
              type: 'radio',
              options: [
                { v: 'url', label: 'MVP は外部 URL 指定のみ', rec: true },
                { v: 'r2', label: 'R2 アップロードも入れる' },
              ],
            },
            {
              id: 'tag_logic',
              label: '複数タグの AND / OR',
              type: 'radio',
              options: [
                { v: 'and', label: 'AND', rec: true },
                { v: 'or', label: 'OR' },
              ],
            },
            {
              id: 'sort_default',
              label: 'タイムラインの初期並び順',
              type: 'radio',
              options: [
                { v: 'new', label: '新しい順', rec: true },
                { v: 'push', label: 'プッシュ数順' },
              ],
            },
          ],
        },
        {
          id: 'product',
          title: 'プロダクト / 運用',
          items: [
            {
              id: 'name',
              label: 'サービス名',
              type: 'text',
              placeholder: 'やった。',
            },
            {
              id: 'domain',
              label: 'ドメイン',
              type: 'text',
              placeholder: '未取得 / 候補',
            },
            {
              id: 'analytics',
              label: 'アクセス解析',
              type: 'radio',
              options: [
                { v: 'none', label: '入れない', rec: true },
                { v: 'cf', label: 'Cloudflare Web Analytics' },
                { v: 'other', label: 'その他' },
              ],
            },
            {
              id: 'privacy',
              label: 'プライバシーポリシー',
              note: 'Cookie と IP ハッシュを扱うため',
              type: 'radio',
              options: [
                { v: 'mvp', label: 'MVP で用意する', rec: true },
                { v: 'later', label: '後回し' },
              ],
            },
            {
              id: 'license',
              label: 'ライセンス',
              type: 'radio',
              options: [
                { v: 'private', label: 'private のまま', rec: true },
                { v: 'mit', label: 'MIT を復活' },
              ],
            },
            {
              id: 'monitoring',
              label: '監視 / エラー追跡',
              type: 'radio',
              options: [
                { v: 'workers', label: 'Workers のログのみ', rec: true },
                { v: 'sentry', label: 'Sentry を入れる' },
              ],
            },
          ],
        },
      ];

      const STORAGE_KEY = 'grill-check-v1';
      const FREE_KEY = 'grill-check-free-v1';

      const state = {
        answers: load(STORAGE_KEY, {}),
        free: load(FREE_KEY, ''),
      };

      function load(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }
      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.answers));
        localStorage.setItem(FREE_KEY, JSON.stringify(state.free));
      }

      const allItems = GROUPS.flatMap((g) => g.items);

      const app = document.getElementById('app');
      const promptEl = document.getElementById('prompt');
      const countEl = document.getElementById('count');

      function render() {
        app.innerHTML =
          GROUPS.map(
            (g) => `
          <section class="group" data-group="${g.id}">
            <h2>${g.title}</h2>
            ${g.items.map(renderItem).join('')}
          </section>`,
          ).join('') +
          `
          <section class="group">
            <h2>その他</h2>
            <div class="item">
              <div class="label">補足・自由記入</div>
              <input type="text" id="free" placeholder="気になる点など" value="${escapeAttr(state.free)}" />
            </div>
          </section>`;
      }

      function renderItem(it) {
        const answered = state.answers[it.id];
        const body =
          it.type === 'radio'
            ? `<div class="opts">${it.options
                .map(
                  (o) => `
              <label class="opt">
                <input type="radio" name="${it.id}" value="${o.v}"
                  ${answered === o.v ? 'checked' : ''} />
                <span>${o.label}${o.rec ? ' <span class="rec">推奨</span>' : ''}</span>
              </label>`,
                )
                .join('')}</div>`
            : `<input type="text" data-text="${it.id}" placeholder="${it.placeholder || ''}"
                 value="${escapeAttr(answered || '')}" />`;
        return `
          <div class="item ${answered ? 'answered' : ''}" data-item="${it.id}">
            <div class="label">${it.label}</div>
            ${it.note ? `<div class="note">${it.note}</div>` : ''}
            ${body}
          </div>`;
      }

      function escapeAttr(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function update() {
        const answered = allItems.filter((it) => state.answers[it.id]).length;
        countEl.textContent = `回答済み ${answered} / ${allItems.length}`;
        promptEl.value = buildPrompt();
        document.querySelectorAll('[data-item]').forEach((el) => {
          el.classList.toggle('answered', !!state.answers[el.dataset.item]);
        });
      }

      function buildPrompt(onlyMissing = false) {
        const lines = ['## 回答'];
        for (const g of GROUPS) {
          const items = g.items.filter((it) =>
            onlyMissing ? !state.answers[it.id] : !!state.answers[it.id],
          );
          if (!items.length) continue;
          lines.push('', `### ${g.title}`);
          for (const it of items) {
            if (onlyMissing) {
              lines.push(`- ${it.label}: `);
              continue;
            }
            let v = state.answers[it.id];
            if (it.options) {
              const o = it.options.find((o) => o.v === v);
              if (o) v = o.label + (o.rec ? '（推奨）' : '');
            }
            lines.push(`- ${it.label}: ${v}`);
          }
        }
        if (!onlyMissing && state.free.trim()) {
          lines.push('', '### その他', state.free.trim());
        }
        return lines.join('\n');
      }

      app.addEventListener('change', (e) => {
        const t = e.target;
        if (t.type === 'radio') {
          state.answers[t.name] = t.value;
          save();
          update();
        }
      });

      app.addEventListener('input', (e) => {
        const t = e.target;
        if (t.dataset && t.dataset.text) {
          state.answers[t.dataset.text] = t.value;
        } else if (t.id === 'free') {
          state.free = t.value;
        } else {
          return;
        }
        save();
        update();
      });

      document.getElementById('copyAll').addEventListener('click', () => {
        copy(buildPrompt(false));
      });
      document.getElementById('copyMissing').addEventListener('click', () => {
        copy(buildPrompt(true));
      });
      document.getElementById('clear').addEventListener('click', () => {
        if (!confirm('回答をすべて消しますか？')) return;
        state.answers = {};
        state.free = '';
        save();
        render();
        update();
      });

      function copy(text) {
        const done = () => toast('コピーしました');
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
        } else {
          fallbackCopy(text, done);
        }
      }
      function fallbackCopy(text, done) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          done();
        } catch {
          toast('コピーできませんでした');
        }
        ta.remove();
      }
      let toastTimer;
      function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 1400);
      }

      render();
      update();
    </script>
  </body>
</html>
